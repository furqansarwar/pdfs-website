<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit PDF Online — PDFS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f8;color:#202536;font-family:"DM Sans",Arial,sans-serif}.top{height:auto;min-height:66px;background:#fff;border-bottom:1px solid #e4e7ef;display:flex;align-items:center;gap:14px;padding:12px 18px;position:sticky;top:0;z-index:10}.top a,.top button,.bar button{border:1px solid #dce1eb;background:#fff;border-radius:9px;padding:10px 14px;text-decoration:none;color:#263047;font-weight:700;cursor:pointer}.top strong{flex:1}.primary{background:#5d45d8!important;color:white!important;border-color:#5d45d8!important}.bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px;background:#fff;border-bottom:1px solid #e4e7ef}.bar label{font-size:13px;font-weight:600}.bar input[type=color]{width:34px;height:32px;border:0;background:none}.bar input[type=number]{width:65px;padding:7px;border:1px solid #ddd;border-radius:7px}.hint{text-align:center;padding:10px;color:#56468f;background:#f0ecff;font-size:13px}.stage{padding:22px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;min-height:65vh}.paper{position:relative;background:white;box-shadow:0 8px 30px #20253625;line-height:0;flex:none}.paper canvas{display:block}.layer{position:absolute;inset:0;line-height:1;overflow:hidden}.edit-item{position:absolute;margin:0;padding:0;border:1px solid transparent;outline:none;resize:none;overflow:hidden;white-space:pre;line-height:1.15;background:transparent;color:transparent;caret-color:#171717;font-family:Arial,sans-serif}.edit-item:focus,.edit-item.changed{background:rgba(255,255,255,.97);border:1px solid #7865df;color:#171717}.added{position:absolute;min-width:90px;min-height:24px;padding:2px 4px;border:1px dashed #6651d5;background:#fff;color:#111;line-height:1.25;white-space:pre-wrap;font:18px Arial;outline:none}.status{text-align:center;padding:12px;color:#596174;background:#fff;border-top:1px solid #e4e7ef;position:sticky;bottom:0}.empty{margin:50px auto;text-align:center;max-width:560px;padding:35px;background:#fff;border:1px solid #e6e9f0;border-radius:18px;box-shadow:0 10px 30px #25304a0d}.empty h1{font-size:26px}.empty p{color:#697386}.empty input{margin:15px auto;max-width:100%}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:650px){.top{padding:10px;gap:8px}.top strong{font-size:14px}.top a,.top button,.bar button{padding:9px;font-size:12px}.stage{padding:8px;justify-content:flex-start}.bar{gap:6px}.hint{font-size:11px}}
</style>
</head>
<body>
<header class="top"><a href="./">← Back</a><strong>PDFS · Edit PDF</strong><button id="save" class="primary" disabled>Save PDF</button></header>
<div class="bar"><label>Text size <input id="size" type="number" min="6" max="96" value="14"></label><label>Text colour <input id="colour" type="color" value="#111111"></label><button id="add" disabled>＋ Add text</button><button id="prev" disabled>Previous</button><span id="pages">Page 0 / 0</span><button id="next" disabled>Next</button></div>
<div class="hint">Upload PDF → click any text on the page to edit it, or choose “Add text” to write anywhere. Then Save PDF.</div>
<section id="empty" class="empty"><h1>Edit your PDF on the page</h1><p>Choose a PDF. Its pages will open here so you can click and edit text directly.</p><input id="file" type="file" accept="application/pdf,.pdf"></section>
<main id="stage" class="stage" hidden><div id="paper" class="paper"><canvas id="canvas"></canvas><div id="layer" class="layer"></div></div></main>
<div id="status" class="status" role="status">Choose a PDF to start editing.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=s=>document.querySelector(s);let pdf=null,file=null,pageNo=1,scale=1.25,dirty=false;
const status=t=>$("#status").textContent=t;
$("#file").addEventListener("change",async e=>{file=e.target.files[0];if(!file)return;try{status("Opening PDF...");const bytes=new Uint8Array(await file.arrayBuffer());pdf=await pdfjsLib.getDocument({data:bytes}).promise;pageNo=1;$("#empty").hidden=true;$("#stage").hidden=false;["save","add","prev","next"].forEach(id=>$("#"+id).disabled=false);await render();}catch(err){status("Could not open PDF: "+err.message)}});
async function render(){const page=await pdf.getPage(pageNo);const viewport=page.getViewport({scale});const canvas=$("#canvas"),ctx=canvas.getContext("2d");canvas.width=viewport.width;canvas.height=viewport.height;canvas.style.width=viewport.width+"px";canvas.style.height=viewport.height+"px";$("#paper").style.width=viewport.width+"px";$("#paper").style.height=viewport.height+"px";await page.render({canvasContext:ctx,viewport}).promise;const content=await page.getTextContent();const layer=$("#layer");layer.innerHTML="";layer.style.width=viewport.width+"px";layer.style.height=viewport.height+"px";
content.items.forEach(item=>{if(!item.str?.trim())return;const tx=pdfjsLib.Util.transform(viewport.transform,item.transform);const height=Math.max(8,Math.hypot(tx[2],tx[3]));const left=tx[4],top=tx[5]-height;const el=document.createElement("textarea");el.className="edit-item";el.value=item.str;el.spellcheck=false;el.style.left=left+"px";el.style.top=top+"px";el.style.width=Math.max(16,item.width*scale+5)+"px";el.style.height=Math.max(height*1.5,14)+"px";el.style.fontSize=height+"px";el.style.fontWeight=/bold|black/i.test(item.fontName)?"bold":"normal";el.addEventListener("focus",()=>{el.classList.add("changed");el.style.width=Math.max(el.scrollWidth,el.clientWidth)+"px"});el.addEventListener("input",()=>{el.classList.add("changed");dirty=true;el.style.width=Math.max(el.scrollWidth,el.clientWidth)+"px"});el.addEventListener("change",()=>dirty=true);layer.appendChild(el)});
$("#pages").textContent="Page "+pageNo+" / "+pdf.numPages;$("#prev").disabled=pageNo===1;$("#next").disabled=pageNo===pdf.numPages;status("Page is open. Click the text you want to correct, then Save PDF.");}
$("#prev").onclick=()=>{if(pageNo>1){pageNo--;render()}};$("#next").onclick=()=>{if(pageNo<pdf.numPages){pageNo++;render()}};
$("#size").onchange=()=>{const el=document.activeElement;if(el&&el.classList.contains("edit-item"))el.style.fontSize=$("#size").value+"px"};
$("#colour").oninput=()=>{const el=document.activeElement;if(el&&el.classList.contains("edit-item"))el.style.color=$("#colour").value};
$("#add").onclick=()=>{const el=document.createElement("div");el.className="added";el.contentEditable="true";el.textContent="Type here";el.style.left="20%";el.style.top="20%";el.style.fontSize=$("#size").value+"px";el.style.color=$("#colour").value;$("#layer").appendChild(el);el.focus();dirty=true};
$("#save").onclick=async()=>{const btn=$("#save");btn.disabled=true;try{const out=await PDFLib.PDFDocument.create();for(let n=1;n<=pdf.numPages;n++){status("Saving page "+n+" of "+pdf.numPages+"...");if(n!==pageNo){pageNo=n;await render()}const shot=await html2canvas($("#paper"),{backgroundColor:"#ffffff",scale:2});const blob=await new Promise(r=>shot.toBlob(r,"image/png"));const img=await out.embedPng(new Uint8Array(await blob.arrayBuffer()));const p=await pdf.getPage(n);const v=p.getViewport({scale:1});const op=out.addPage([v.width,v.height]);op.drawImage(img,{x:0,y:0,width:v.width,height:v.height})}const bytes=await out.save();const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));const a=document.createElement("a");a.href=url;a.download=file.name.replace(/\.pdf$/i,"")+"_edited.pdf";a.click();URL.revokeObjectURL(url);status("Edited PDF downloaded.");}catch(err){status("Save failed: "+err.message)}finally{btn.disabled=false}};
</script>
</body></html>
